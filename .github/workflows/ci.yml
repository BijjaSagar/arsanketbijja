name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:../data/cms.db
      SESSION_SECRET: ci-build-placeholder-secret-min-32-chars-long!!
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: CiBuildPassword123!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
